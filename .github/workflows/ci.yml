name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    # macos-15 ships Xcode 16.x by default, which provides the Swift 6
    # toolchain that Package.swift's `swift-tools-version: 6.0` requires.
    # The Xcode version is pinned explicitly below rather than relying on
    # the image default, so a runner image refresh cannot silently move it.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2'
      - name: Swift version
        run: swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test
